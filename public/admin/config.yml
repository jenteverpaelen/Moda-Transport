# =============================================================
#  Beheerscherm van Moda  (Sveltia CMS)
# -------------------------------------------------------------
#  Wat hier staat, bepaalt welke schermen en velden het reisbureau
#  te zien krijgt op /admin/. Wat ze invullen, wordt als gewoon
#  bestand naar GitHub geschreven; Cloudflare zet de site daarna
#  vanzelf opnieuw online.
#
#  De velden hieronder moeten overeenkomen met src/content.config.mjs.
#  Pas je hier iets aan, pas het daar dan ook aan.
# =============================================================

backend:
  name: github
  repo: jenteverpaelen/Moda-Transport
  # De branch die Cloudflare bouwt. Verandert die, verander hem hier ook.
  branch: claude/moda-transport-website-xo8e61
  # Adres van het inlogscriptje op Cloudflare Workers.
  # Zolang dit niet ingevuld is, kan er niemand inloggen. Zie CMS.md.
  base_url: VUL_HIER_JE_WORKER_URL_IN

# Waar losse afbeeldingen terechtkomen die niet bij een reis horen.
media_folder: "public/assets/images"
public_folder: "/assets/images"

site_url: https://moda.be
logo_url: /assets/images/logo-moda.png

# Hoe de bestandsnaam (en dus het webadres) van een reis gemaakt wordt:
# "Un weekend à Paris 🥐" wordt un-weekend-a-paris.
slug:
  encoding: "ascii"
  clean_accents: true

collections:
  # ===========================================================
  #  REIZEN
  # ===========================================================
  - name: reizen
    label: "Reizen"
    label_singular: "Reis"
    description: >-
      Elke reis hier wordt een tegel op de pagina Bestemmingen én krijgt een
      eigen pagina met alle info. Verwijderen kan, maar wil je een reis enkel
      tijdelijk van de site halen, zet dan "Op de website" uit.
    folder: "src/content/reizen"
    create: true
    delete: true
    identifier_field: titel
    slug: "{{fields.titel}}"
    summary: "{{fields.bestemming}} — {{fields.titel}}"
    sortable_fields: [volgorde, vertrek, titel, bestemming]
    # Foto's van een reis komen hier terecht en worden bij het bouwen
    # automatisch verkleind.
    media_folder: "../../assets/travel/reizen"
    public_folder: "../../assets/travel/reizen"
    fields:
      - { name: titel, label: "Titel van de reis", widget: string,
          hint: "Zoals je hem op Instagram zou zetten, bv. Bon Bini !" }

      - { name: bestemming, label: "Bestemming", widget: string,
          hint: "Dit woord staat groot op de tegel, bv. Curaçao of Lapland." }

      - { name: samenvatting, label: "Eén regel uitleg", widget: string, required: false,
          hint: "Komt onder de bestemming op de tegel, bv. Grieks eiland, azuurblauw water." }

      - name: fotos
        label: "Foto's"
        label_singular: "Foto"
        widget: list
        field: { name: foto, label: "Foto", widget: image }
        hint: "De eerste foto is de hoofdfoto: die komt op de tegel en bovenaan de reispagina. Ze worden vanzelf verkleind en bijgesneden, dus je hoeft nergens op te letten."

      - name: reisstijl
        label: "Reisstijl"
        widget: select
        required: false
        options: ["Luxereizen", "Avontuurlijke reizen", "Familiereizen", "Romantische reizen"]
        hint: "Dezelfde vier als op de pagina Reisstijlen."

      - { name: label, label: "Woordje op de tegel", widget: string, required: false,
          hint: "Bv. Winter, Rondreis, Stedentrip of Zon & zee. Laat je dit leeg, dan komt de reisstijl erop." }

      - { name: prijs, label: "Prijs per persoon (€)", widget: number, required: false,
          value_type: int, min: 0,
          hint: "Enkel het getal, dus 1279 en geen euroteken." }

      - { name: prijsnoot, label: "Wat zit er in die prijs?", widget: string, required: false,
          hint: "Komt klein onder de prijs, bv. inclusief ontbijtbuffet." }

      - { name: vertrek, label: "Vertrekdatum", widget: datetime, required: false,
          date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD", picker_utc: true,
          hint: "Vertrekt de reis op één vaste dag? Vul die hier in." }

      - { name: vertrektekst, label: "Of: vertrek in woorden", widget: string, required: false,
          hint: "Voor reizen die vaker vertrekken, bv. elke vrijdag. Vul je hierboven een datum in, dan wint die." }

      - { name: duur, label: "Duur", widget: string, required: false,
          hint: "Bv. 9 nachten of 1 overnachting." }

      - { name: luchthaven, label: "Vertrek vanuit", widget: string, required: false,
          hint: "Bv. BRU, AMS of Brussel." }

      - name: inbegrepen
        label: "Wat is inbegrepen"
        label_singular: "Punt"
        widget: list
        required: false
        field: { name: punt, label: "Inbegrepen", widget: string }
        hint: "Elk punt komt als een aparte regel met een vinkje op de reispagina."

      - { name: body, label: "Beschrijving", widget: markdown,
          hint: "Het verhaal van de reis. Hier mag je gerust meerdere alinea's schrijven." }

      - { name: uitgelicht, label: "Uitgelicht (grote tegel)", widget: boolean, default: false,
          hint: "Zet dit aan bij de reis die je vooraan wil, in de grote tegel. Doe dit bij één reis tegelijk." }

      - { name: zichtbaar, label: "Op de website", widget: boolean, default: true,
          hint: "Uitzetten haalt de reis van de site zonder hem te verwijderen." }

      - { name: volgorde, label: "Volgnummer", widget: number, required: false,
          value_type: int, min: 1,
          hint: "Laag getal staat vooraan. Laat je dit leeg, dan sorteert de reis op vertrekdatum." }

      - { name: instagram, label: "Link naar de Instagram-post", widget: string, required: false,
          hint: "Optioneel. Zet er dan een knopje 'Bekijk op Instagram' bij." }

  # ===========================================================
  #  CONTACTGEGEVENS
  # ===========================================================
  - name: instellingen
    label: "Contactgegevens"
    files:
      - name: reisbureau
        label: "Reisbureau (Moda Travel)"
        file: "public/content/travel-settings.json"
        description: "Deze gegevens staan onderaan elke reispagina en op de contactpagina van het reisbureau."
        fields:
          - { name: bedrijfsnaam, label: "Naam", widget: string }
          - { name: telefoon_weergave, label: "Telefoon zoals hij op de site staat", widget: string }
          - { name: telefoon_link, label: "Telefoon om te bellen", widget: string,
              hint: "Met landcode en zonder spaties, bv. +3211243003." }
          - { name: email, label: "E-mailadres", widget: string }
          - { name: whatsapp_nummer, label: "WhatsApp-nummer", widget: string,
              hint: "Landcode zonder plus en zonder spaties, bv. 32470123456." }
          - { name: whatsapp_bericht, label: "Tekst die al klaarstaat in WhatsApp", widget: string }
          - { name: straat, label: "Straat en nummer", widget: string }
          - { name: postcode, label: "Postcode", widget: string }
          - { name: gemeente, label: "Gemeente", widget: string }
          - { name: instagram, label: "Instagram", widget: string }
          - { name: facebook, label: "Facebook", widget: string }
          - { name: note, label: "Notitie (niet zichtbaar op de site)", widget: text, required: false }

      - name: vervoer
        label: "Luchthavenvervoer & transport"
        file: "public/content/settings.json"
        description: "Deze gegevens staan op de pagina's van het luchthavenvervoer en het transport."
        fields:
          - { name: bedrijfsnaam, label: "Naam", widget: string }
          - { name: telefoon_weergave, label: "Telefoon zoals hij op de site staat", widget: string }
          - { name: telefoon_link, label: "Telefoon om te bellen", widget: string }
          - { name: email, label: "E-mailadres", widget: string }
          - { name: whatsapp_nummer, label: "WhatsApp-nummer", widget: string }
          - { name: whatsapp_bericht, label: "Tekst die al klaarstaat in WhatsApp", widget: string }
          - { name: adres, label: "Adres", widget: string }
